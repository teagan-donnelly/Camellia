# Camellia backend configuration.
# Secrets come from environment variables or a git-ignored .env file (see ../.env.example).
# NEVER commit real credentials.

spring:
  application:
    name: camellia-backend
  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:../.env[.properties]
  # The DataSource is built by com.camellia.config.DataSourceConfig (Snowflake, or the labeled local fallback).
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  error:
    include-message: always

logging:
  level:
    root: INFO
    com.camellia: INFO
    net.snowflake: WARN
    # The 4.x driver probes cloud metadata endpoints (AWS/Azure/GCP) at startup; on a laptop those probes fail
    # harmlessly and log as ERROR. Real connection failures still surface as exceptions with diagnostics.
    net.snowflake.client.internal.jdbc.RestRequest: "OFF"
    com.zaxxer.hikari: WARN

camellia:
  cors-origins: ${CAMELLIA_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

  database:
    # auto      -> Snowflake when SNOWFLAKE_* variables are present, otherwise the LOCAL DEV FALLBACK (H2 file)
    # snowflake -> Snowflake only; startup fails with a diagnostic message if configuration is missing
    # local     -> LOCAL DEV FALLBACK only (never presented as Snowflake)
    mode: ${CAMELLIA_DB_MODE:auto}
    init-schema: ${CAMELLIA_INIT_SCHEMA:true}
    seed-on-startup: ${CAMELLIA_SEED_ON_STARTUP:true}
    analyze-on-startup: ${CAMELLIA_ANALYZE_ON_STARTUP:true}
    local-url: ${CAMELLIA_LOCAL_DB_URL:jdbc:h2:file:./data/camellia-local}

  snowflake:
    account: ${SNOWFLAKE_ACCOUNT:}
    user: ${SNOWFLAKE_USER:}
    private-key-file: ${SNOWFLAKE_PRIVATE_KEY_FILE:}
    private-key-passphrase: ${SNOWFLAKE_PRIVATE_KEY_PASSPHRASE:}
    warehouse: ${SNOWFLAKE_WAREHOUSE:}
    database: ${SNOWFLAKE_DATABASE:CAMELLIA_DEMO}
    schema: ${SNOWFLAKE_SCHEMA:CLINICAL}
    role: ${SNOWFLAKE_ROLE:}
    create-database-if-missing: ${SNOWFLAKE_CREATE_DATABASE:true}

  gemini:
    api-key: ${GEMINI_API_KEY:${GOOGLE_API_KEY:}}
    model: ${GEMINI_MODEL:gemini-3.8-flash}
    timeout-seconds: ${GEMINI_TIMEOUT_SECONDS:60}
    # Upper bound on characters of source-record context sent per request (retrieval budget).
    max-context-chars: ${GEMINI_MAX_CONTEXT_CHARS:28000}
    max-history-turns: 8
    # Used only when the primary model is overloaded (503) or rate limited (429) after retries.
    # The UI always shows which model actually answered. Blank disables the fallback.
    fallback-model: ${GEMINI_FALLBACK_MODEL:gemini-3.5-flash-lite}
    # minimal | low | medium | high | blank (model default). Lower = faster answers.
    thinking-level: ${GEMINI_THINKING_LEVEL:low}
    max-retries: ${GEMINI_MAX_RETRIES:2}
    # Total time one request may spend on Gemini across retries and the fallback model; an attempt only starts when a
    # full timeout still fits. 0 = no bound. Set it below the API gateway's limit in the cloud (e.g. 25 for a 30 s limit).
    request-budget-seconds: ${GEMINI_REQUEST_BUDGET_SECONDS:0}

  demo:
    # Synthetic dates are stored relative to this anchor. Blank = the date the demo data is seeded.
    anchor-date: ${CAMELLIA_DEMO_ANCHOR_DATE:}
    # Signs the SIMULATED demo-identity cookie. Blank = random per startup (users re-select after a restart).
    session-secret: ${CAMELLIA_DEMO_SESSION_SECRET:}
    # "Reset demo data" and "Simulate lab result" in the UI. Turn off for any public deployment; the camellia-jobs
    # function performs those operations instead (see SERVERLESS_ARCHITECTURE.md).
    admin-enabled: ${CAMELLIA_DEMO_ADMIN_ENABLED:true}

  monitoring:
    # Simulated wearable data is stored in UTC and shown in hospital-local time.
    hospital-time-zone: ${CAMELLIA_HOSPITAL_TIME_ZONE:America/New_York}
    stale-data-minutes: ${CAMELLIA_MONITORING_STALE_MINUTES:30}
    # The clearly labeled wristband simulator controls (synthetic data only).
    simulator-enabled: ${CAMELLIA_SIMULATOR_ENABLED:true}

  briefing:
    # Hard upper bound on briefing audio. The script is estimated first, then the real audio duration is verified.
    max-audio-seconds: 480
    words-per-minute: 150
    max-script-attempts: 3
    # Non-public storage for generated audio (served only through the authorized /api/briefings/{id}/audio endpoint).
    audio-dir: ${CAMELLIA_BRIEFING_AUDIO_DIR:./data/briefings}

  elevenlabs:
    api-key: ${ELEVENLABS_API_KEY:}
    base-url: ${ELEVENLABS_BASE_URL:https://api.elevenlabs.io}
    # Blank = use the first premade voice whose use case matches voice-use-case (looked up through the API once).
    voice-id: ${ELEVENLABS_VOICE_ID:}
    voice-use-case: ${ELEVENLABS_VOICE_USE_CASE:conversational}
    model-id: ${ELEVENLABS_MODEL_ID:eleven_multilingual_v2}
    output-format: ${ELEVENLABS_OUTPUT_FORMAT:mp3_44100_128}
    # Characters per request; eleven_multilingual_v2 accepts up to 10,000.
    max-characters: ${ELEVENLABS_MAX_CHARACTERS:9500}
    stability: 0.55
    similarity-boost: 0.75
    style: 0.0
    speed: 1.0
    timeout-seconds: ${ELEVENLABS_TIMEOUT_SECONDS:180}
    max-retries: ${ELEVENLABS_MAX_RETRIES:2}

  jobs:
    # Enables POST /events, the non-HTTP entry point for scheduled and operator jobs (seeding, screening, demo reset).
    # Only for the camellia-jobs function, which has no public route. Never enable it on the internet-facing API.
    enabled: ${CAMELLIA_JOBS_ENABLED:false}

  # ---------------------------------------------------------------------------
  # PROTOTYPE SCREENING HEURISTICS — NOT VALIDATED CLINICAL THRESHOLDS.
  # These values exist only to drive explainable demo rules on synthetic data.
  # ---------------------------------------------------------------------------
  rules:
    ob-anesthesia:
      lookahead-days: 120
      lab-lookback-days: 300
      expedited-within-days: 21
      review-lead-days: 7
      platelet-test-codes: [ "777-3" ]
      # Prototype heuristic: results below this value are highlighted in the explanation (unit 10*3/uL).
      platelet-highlight-below: 100
      relevant-condition-terms:
        "[Hematologic]": [ thrombocytopenia, von willebrand, immune thrombocytopenic, coagulopathy, bleeding disorder ]
        "[Cardiac]": [ cardiomyopathy, ejection fraction, congenital heart, pulmonary hypertension, aortic stenosis ]
        "[Prior anesthesia history]": [ malignant hyperthermia, difficult airway, failed epidural, difficult neuraxial, post-dural puncture ]
        "[Spine]": [ spinal fusion, harrington rod, scoliosis repair ]
        "[Oncology]": [ lymphoma, malignancy, chemotherapy, mediastinal radiation ]
      anticoagulant-terms: [ enoxaparin, heparin, fondaparinux, warfarin, apixaban, rivaroxaban ]
    recurrent-fracture:
      min-encounters: 3
      lookback-days: 1825
    repeated-abnormal-lab:
      min-results: 3
      lookback-days: 730
    repeated-symptom:
      min-encounters: 3
      lookback-days: 365
